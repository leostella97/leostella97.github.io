<!-- Favicon do Gabarito Café (mesmo desenho do logo, para a aba do navegador) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gabarito Café">
  <!-- Círculo de fundo, cor de café torrado -->
  <circle cx="32" cy="32" r="30" fill="#6f4e37" />
  <!-- Vapor subindo da xícara -->
  <path d="M20 17 q4 -6 0 -11" fill="none" stroke="#f3d9a4" stroke-width="3" stroke-linecap="round" />
  <path d="M32 17 q4 -6 0 -11" fill="none" stroke="#f3d9a4" stroke-width="3" stroke-linecap="round" />
  <path d="M44 17 q4 -6 0 -11" fill="none" stroke="#f3d9a4" stroke-width="3" stroke-linecap="round" />
  <!-- Corpo da xícara, creme claro -->
  <path d="M13 28 h38 v15 a11 11 0 0 1 -11 11 H24 a11 11 0 0 1 -11 -11 Z" fill="#fdf8f0" />
  <!-- Alça da xícara -->
  <path d="M51 32 h3 a7 7 0 0 1 0 14 h-3" fill="none" stroke="#fdf8f0" stroke-width="4" />
  <!-- O visto dentro da xícara -->
  <path d="M22 37 l7 7 l14 -15" fill="none" stroke="#3f8f63" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Grão de café decorativo -->
  <ellipse cx="43" cy="49" rx="3" ry="4.5" fill="#6f4e37" transform="rotate(30 43 49)" />
</svg>
