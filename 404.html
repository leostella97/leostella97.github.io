<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProtocolFit — redirecionando…</title>
  <link rel="icon" href="https://leostella97.github.io/ProtocolFit/favicon.png" />
  <style>
    /* Página de redirecionamento com a identidade visual do ProtocolFit. */
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #10a37f, #14b8a6); color: #fff; text-align: center;
    }
    .caixa { padding: 32px; max-width: 520px; }
    h1 { font-size: 22px; margin: 14px 0 6px; }
    p { opacity: .92; font-size: 15px; line-height: 1.6; margin: 0 0 18px; }
    a {
      display: inline-block; background: #fff; color: #0b7d61; font-weight: 700;
      text-decoration: none; padding: 12px 24px; border-radius: 10px;
    }
    code { background: rgba(255,255,255,.18); padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="caixa">
    <div style="font-size:40px">🔎</div>
    <h1>Redirecionando…</h1>
    <p>
      Você digitou <code id="aliasDigitado"></code> — o endereço oficial é
      <code id="enderecoOficial"></code>. Estamos te levando para lá automaticamente.
    </p>
    <!-- Link manual (também usado quando o JavaScript está desativado). -->
    <a id="linkManual" href="/">Ir para o site</a>
  </div>
  <script>
    /*
     * Este arquivo é servido pelo GitHub Pages em endereços não encontrados.
     * Redireciona APENAS variações conhecidas do ProtocolFit:
     *   - protocolfit (minúsculo)
     *   - ProtocoloFit (com "o" extra)
     *   - PROTOCOLFIT (maiúsculo)
     *   - qualquer outra caixa dessas variações
     * Outros caminhos (outros sites do domínio) NÃO são redirecionados.
     */
    (function () {
      // Caminho solicitado (ex.: "/protocolfit/painel/").
      var caminho = window.location.pathname || '/';
      // Divide em segmentos, ignorando barras vazias.
      var segmentos = caminho.split('/').filter(function (parte) { return parte.length > 0; });
      
      if (segmentos.length === 0) {
        // Raiz do domínio - não redireciona (o index.html já cuida disso)
        return;
      }
      
      // Primeiro segmento do caminho (nome do "projeto" digitado).
      var primeiro = segmentos[0].toLowerCase();
      
      // Variações conhecidas que devem ser redirecionadas para seus endereços oficiais.
      // Cada entrada: chave = variação digitada (lowercase), valor = caminho oficial.
      // TEAM_002: removidas as chaves duplicadas ('protocolfit' e 'gabaritocafe'
      // apareciam duas vezes; num literal de objeto a última ocorrência vence,
      // então as repetições eram código morto).
      var redirecionamentos = {
        // ProtocolFit: 'protocolfit' cobre qualquer caixa (PROTOCOLFIT etc.) e
        // 'protocolofit' cobre o typo com "o" extra (ProtocoloFit).
        'protocolfit': '/ProtocolFit/',
        'protocolofit': '/ProtocolFit/',
        // GabaritoCafe: sem e com acento.
        'gabaritocafe': '/GabaritoCafe/',
        'gabaritocafé': '/GabaritoCafe/'
      };
      
      // Verifica se o primeiro segmento é uma variação conhecida.
      var destino = redirecionamentos[primeiro];
      var ehVariacaoConhecida = destino !== undefined;
      
      if (!ehVariacaoConhecida) {
        // Não é uma variação conhecida - não redireciona.
        // O navegador mostra esta página 404 normalmente.
        return;
      }
      
      // É uma variação conhecida - redireciona para o endereço oficial.
      var resto = segmentos.slice(1).join('/');
      // O destino já inclui a barra final (ex.: '/ProtocolFit/')
      var destinoCompleto = destino + (resto ? resto + '/' : '') + (window.location.search || '') + (window.location.hash || '');
      
      // Preenche as informações na página.
      document.getElementById('aliasDigitado').textContent = '/' + segmentos[0] + '/';
      document.getElementById('enderecoOficial').textContent = destino;
      
      // Atualiza o link manual.
      document.getElementById('linkManual').setAttribute('href', destinoCompleto);
      document.getElementById('linkManual').textContent = 'Ir para ' + destino;
      
      // Redireciona imediatamente (replace evita poluir o histórico).
      window.location.replace(destinoCompleto);
    })();
  </script>
</body>
</html>
