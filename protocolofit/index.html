<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProtocolFit — abrindo…</title>
  <meta name="description" content="ProtocolFit: treino e dieta personalizados com cálculo determinístico. 100% gratuito." />
  <link rel="icon" href="https://leostella97.github.io/ProtocolFit/favicon.png" />
  <!-- ALIAS "/protocolofit" — o endereço oficial é /ProtocolFit/ (uma letra a menos). -->
  <link rel="canonical" href="https://leostella97.github.io/ProtocolFit/" />
  <!-- O alias existe só para o link não quebrar: não deve ser indexado. -->
  <meta name="robots" content="noindex, follow" />
  <!-- Redireciona na hora, mesmo com JavaScript desativado. -->
  <meta http-equiv="refresh" content="0; url=/ProtocolFit/" />
  <style>
    /* Estilo mínimo com a paleta de saúde do ProtocolFit. */
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #10a37f, #14b8a6); color: #fff; text-align: center;
    }
    .caixa { padding: 32px; max-width: 520px; }
    h1 { font-size: 22px; margin: 14px 0 6px; }
    p { opacity: .92; font-size: 15px; line-height: 1.6; margin: 0 0 18px; }
    a {
      display: inline-block; background: #fff; color: #0b7d61; font-weight: 700;
      text-decoration: none; padding: 12px 24px; border-radius: 10px;
    }
    code { background: rgba(255,255,255,.18); padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="caixa">
    <div style="font-size:40px">💚</div>
    <h1>ProtocolFit</h1>
    <p>
      Você chegou por <code>/protocolofit</code> — o endereço oficial é
      <code>/ProtocolFit</code>. Estamos te levando para lá.
    </p>
    <!-- Link manual para quem tiver o JavaScript desativado. -->
    <a id="linkManual" href="/ProtocolFit/">Ir agora para o ProtocolFit</a>
  </div>
  <script>
    // Troca o primeiro segmento do caminho pelo nome oficial, preservando
    // subpastas (ex.: /protocolofit/painel/), parâmetros e âncora.
    (function () {
      var resto = window.location.pathname.replace(/^\/[^/]+/, '');
      var destino = '/ProtocolFit' + (resto || '/') + (window.location.search || '') + (window.location.hash || '');
      document.getElementById('linkManual').setAttribute('href', destino);
      window.location.replace(destino);
    })();
  </script>
</body>
</html>
